[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.9.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
kvm-core = { version = "0.1.0", path = "crates/kvm-core" }
kvm-kvmd = { version = "0.1.0", path = "crates/kvm-kvmd" }
proptest = "1.12.0"
rcgen = "0.14.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
rpassword = "7.5.4"
rustix = "1.1.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = "1.9.1"

# The rust table denies lints CI already makes errors through `-D warnings`, so a local `cargo build` or `cargo clippy` enforces them too, and adds the unsafe-code policy: `unsafe_code` is denied, so each function holding unsafe code opts in with a justified `#[allow(unsafe_code)]`, and Clippy requires a `// SAFETY:` comment on every unsafe block.
# The clippy table also denies `dbg!`, `todo!` and `unimplemented!`, allow-by-default restriction lints that `-D warnings` alone does not reject.
# examples/in-process is its own workspace and repeats both tables; its tests check the copies stay identical.
[workspace.lints.rust]
dead_code = "deny"
unreachable_patterns = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
