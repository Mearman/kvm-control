[package]
name = "kvm-in-process-example"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, so it resolves the crates as an outside consumer does; the lint tables repeat the repository workspace's, which tests/lints.rs checks.
[workspace]

[workspace.lints.rust]
dead_code = "deny"
unreachable_patterns = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[lints]
workspace = true

[dependencies]
kvm-core = { path = "../../crates/kvm-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
kvm-kvmd = { path = "../../crates/kvm-kvmd" }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9.0", features = ["tls-rustls-no-provider"], default-features = false }
rcgen = "0.14.10"
url = "2"
serde_json = "1"
