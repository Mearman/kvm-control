name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      abandon_invalid_tag:
        description: Unreleased invalid tag to abandon without altering it
        required: false
        type: string

permissions:
  contents: read

# A run on main can push a release tag and then spend its remaining jobs building and publishing that release, so main runs queue instead of cancelling each other; a superseded pull request run has no such cost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            examples/in-process -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      # The example is its own workspace, so the workspace-wide steps above do not reach it.
      - name: Check independent consumer formatting
        run: cargo fmt --check --manifest-path examples/in-process/Cargo.toml
      - name: Check independent consumer Clippy
        run: cargo clippy --locked --all-targets --manifest-path examples/in-process/Cargo.toml -- -D warnings
      - name: Test independent consumer
        run: cargo test --locked --manifest-path examples/in-process/Cargo.toml
      - name: Test release version stamping
        run: bash .github/scripts/test-release-version.sh

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: convco@0.7.2
      - name: Test release planning and recovery
        run: bash .github/scripts/test-release.sh

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: convco@0.7.2
      - name: Check conventional commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: convco check "$BASE..$HEAD"

  # Decides what the archive jobs build. On main it is the release plan from version.sh: every tagged release whose publication is unfinished, then the next version the conventional commits since the last release call for, if any. A pull request builds its own head, stamped with version 0.0.0, which no release can carry because the first release is 0.1.0.
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      abandon: ${{ steps.plan.outputs.abandon }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: github.event_name != 'pull_request'
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: github.event_name != 'pull_request'
        with:
          tool: convco@0.7.2
      - id: plan
        name: Calculate release plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          ABANDON_INVALID_TAG: ${{ inputs.abandon_invalid_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            plan=$(jq -cn --arg commit "$GITHUB_SHA" '[{tag:"v0.0.0",commit:$commit}]')
            printf 'plan=%s\nabandon=\n' "$plan" >> "$GITHUB_OUTPUT"
            PLAN="$plan" bash .github/scripts/release-matrix.sh
          else
            bash .github/scripts/version.sh
          fi
      - name: Verify release binaries exist
        if: github.event_name != 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: bash .github/scripts/check-release-binaries.sh

  archives:
    name: Archive (${{ matrix.tag }}, ${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.plan != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      # A recovered release builds its own commit, which may predate the release tooling, so the tooling comes from the commit that started the run.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set release package version
        env:
          TAG: ${{ matrix.tag }}
        run: bash .release-tools/.github/scripts/set-release-version.sh "$TAG"
      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --workspace --bins --message-format=json > "$RUNNER_TEMP/build-messages.json"
      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ matrix.tag }}
        run: bash .release-tools/.github/scripts/package-archive.sh "$TARGET" "$TAG" "$RUNNER_TEMP/build-messages.json"
      - name: Smoke test archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ matrix.tag }}
        run: bash .release-tools/.github/scripts/smoke-test-archive.sh "dist/kvm-control-${TAG}-${TARGET}.tar.gz" "${TAG#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.tag }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # The release jobs below run only for main: they push tags and publish GitHub releases with the workflow token.
  release-intent:
    name: Record release intent
    needs: [checks, release-scripts, plan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.plan.outputs.plan != '[]' || needs.plan.outputs.abandon != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Push release and abandonment tags
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          ABANDON: ${{ needs.plan.outputs.abandon }}
        run: bash .github/scripts/record-release-intent.sh

  publish:
    name: Publish release
    needs: [plan, release-intent, archives]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.plan != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: v*
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: convco@0.7.2
      - name: Verify assets and publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
        run: bash .github/scripts/publish-plan.sh

  # Installs each published archive the way a user would: an unauthenticated download of the public release assets, checksum verification, and the smoke test on a runner of the archive's target.
  verify-release:
    name: Verify release (${{ matrix.tag }}, ${{ matrix.target }})
    needs: [plan, publish]
    if: needs.plan.outputs.plan != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download and verify published archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          name="kvm-control-${TAG}-${TARGET}.tar.gz"
          mkdir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          curl -fsSLO "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
          curl -fsSLO "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}.sha256"
          shasum -a 256 -c "${name}.sha256"
      - name: Smoke test published archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ matrix.tag }}
        run: bash .github/scripts/smoke-test-archive.sh "$RUNNER_TEMP/release/kvm-control-${TAG}-${TARGET}.tar.gz" "${TAG#v}"
