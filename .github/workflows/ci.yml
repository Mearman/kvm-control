name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install release test dependency
        if: matrix.os == 'ubuntu-latest'
        run: cargo install convco --version 0.7.2 --locked
      - name: Test release recovery
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/test-release.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Test release version metadata
        run: bash .github/scripts/test-release-version.sh

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo install convco --version 0.7.2 --locked
      - name: Check conventional commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: convco check "$BASE..$HEAD"

  version:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      plan: ${{ steps.version.outputs.plan }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo install convco --version 0.7.2 --locked
      - id: version
        name: Calculate release version
        shell: bash
        env:
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/version.sh
      - name: Record release intent
        env:
          PLAN: ${{ steps.version.outputs.plan }}
        run: bash .github/scripts/record-release-intent.sh

  archives:
    needs: version
    if: needs.version.outputs.plan != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Set release package version
        env:
          TAG: ${{ matrix.tag }}
        run: bash .release-tools/.github/scripts/set-release-version.sh "$TAG"
      - name: Build all interfaces
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --workspace --bins
      - name: Create and verify archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          name="kvm-control-${TAG}-${TARGET}.tar.gz"
          mkdir -p dist
          cargo metadata --no-deps --format-version 1 | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name' > binaries.txt
          test -s binaries.txt
          while IFS= read -r binary; do
            test -x "target/$TARGET/release/$binary"
          done < binaries.txt
          tar -czf "dist/$name" -C "target/$TARGET/release" -T "$GITHUB_WORKSPACE/binaries.txt"
          (cd dist && shasum -a 256 "$name" > "$name.sha256" && shasum -a 256 -c "$name.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.tag }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, archives]
    if: needs.version.outputs.plan != '[]' && needs.archives.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo install convco --version 0.7.2 --locked
      - name: Verify assets and publish draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.version.outputs.plan }}
        run: bash .github/scripts/publish-plan.sh
